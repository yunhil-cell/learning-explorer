<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>배움 원정대</title>
  <link rel="icon" href="favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="header">
    <h1 style="margin:0;">배움 원정대</h1>
    <p style="font-size: 0.9em; color: #F1F5F9; margin-top: 5px;">지혜를 찾아 떠나는 여정</p>
    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
      <button class="hof-btn" style="background: linear-gradient(135deg, #42B3A4, #2c7a70); margin-top: 0;" onclick="openGameGuideModal()">📜 가이드</button>
      <button class="hof-btn" style="margin-top: 0;" onclick="openHallOfFame()">👑 명예의 전당</button>
      <button class="hof-btn" style="background: linear-gradient(135deg, #FECACA, #F87171); color: var(--TextMain); margin-top: 0; position: relative;" onclick="openNoticeBoard()">
        📢 공지사항
        <span id="noticeBadge" class="n-badge" style="display:none; border: 1px solid #F87171;">N</span>
      </button>
      <button class="hof-btn" style="background: linear-gradient(135deg, #EF4444, #991B1B); color: white; margin-top: 0; box-shadow: 0 0 15px rgba(239,68,68,0.4);" onclick="openWorldBossModal()">
        월드 보스
      </button>
      <button class="hof-btn" style="background: linear-gradient(135deg, #A78BFA, #8B5CF6); color: white; margin-top: 0;" onclick="manualRefresh()">🔄 새로고침</button>
    </div>
  </div>

  <!-- 월드 보스 학급 공통 현황 배너 (이모지 제거 및 세련된 타이포그래피) -->
  <div id="worldBossBanner" style="max-width: 1200px; margin: 15px auto 5px auto; padding: 0 20px; display: none;">
    <div style="background: linear-gradient(90deg, #181124 0%, #0F172A 100%); border: 1.5px solid #EF4444; border-radius: 12px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.15); transition: 0.2s;" onclick="openWorldBossModal()" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'">
      <div style="text-align: left;">
        <div id="wbBannerTitle" style="color: #F87171; font-weight: bold; font-size: 1.1em; letter-spacing: 0.5px;"></div>
        <div id="wbBannerHpText" style="color: #94A3B8; font-size: 0.85em; margin-top: 2px;"></div>
      </div>
      <div style="width: 40%; max-width: 300px; text-align: right;">
        <div id="wbBannerHpPct" style="color: #FBBF24; font-weight: bold; font-size: 0.9em; margin-bottom: 4px;">0%</div>
        <div style="width: 100%; background: #334155; height: 8px; border-radius: 4px; overflow: hidden;">
          <div id="wbBannerHpFill" style="width: 0%; background: linear-gradient(90deg, #EF4444, #F59E0B); height: 100%; transition: width 0.5s;"></div>
        </div>
      </div>
    </div>
  </div>

  <div
    style="max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: flex-end; margin-bottom: -10px; gap: 10px;">
    <button id="noticeAdminBtn" onclick="openNoticeAdmin()" style="display:none; background:#3B82F6; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.5); font-size: 1em; transition: 0.3s; z-index: 10;">
      📢 공지 관리
    </button>
    <button id="questAdminBtn" onclick="openQuestAdmin()" style="display:none; background:#8B5CF6; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.5); font-size: 1em; transition: 0.3s; z-index: 10;">
      📜 퀘스트 관리
    </button>
    <button id="statAdminBtn" onclick="openClassroomDashboard()" style="display:none; background:#0D9488; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.5); font-size: 1em; transition: 0.3s; z-index: 10;">
      📊 학급 통계
    </button>
    <button id="exchangeAdminBtn" onclick="openExchangeAdmin()" style="display:none; background:#10B981; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.5); font-size: 1em; transition: 0.3s; z-index: 10;">
      💱 환전소
    </button>
    <button id="logAdminBtn" onclick="openLogAdmin()" style="display:none; background:#6366F1; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.5); font-size: 1em; transition: 0.3s; z-index: 10;">
      📜 로그 확인
    </button>
    <button id="mainTeacherBtn" onclick="toggleTeacherMode()" style="background:#444; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow:0 2px 5px rgba(0,0,0,0.5); font-size: 1em; transition: 0.3s; z-index: 10;">
      🔒 교사 모드 OFF
    </button>
  </div>

  <div id="hofModal" class="modal" style="z-index: 2500;">
    <div class="modal-content"
      style="max-width: 700px; background: linear-gradient(180deg, #1a1a2e 0%, var(--Bg) 100%); border: 2px solid #FFD700;">
      <span class="close-btn" onclick="document.getElementById('hofModal').style.display='none'">&times;</span>
      <h2 style="color:#FFD700; margin-top:0; font-size:2em; text-shadow: 0 0 15px rgba(255,215,0,0.5);">👑 명예의 전당</h2>
      <p style="color:#aaa;">가장 많은 지혜와 위대한 업적을 달성한 모험가들입니다.</p>
      <div id="hofPodium" class="podium-container">
      </div>
      <button class="btn-main" style="background:#444; margin-top:40px;" onclick="document.getElementById('hofModal').style.display='none'">닫기</button>
    </div>
  </div>

  <div id="loading">모험가들의 데이터를 불러오는 중...</div>
  <div class="grid-container" id="studentGrid"></div>

  <div id="detailModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="subModal" class="modal" style="display:none; z-index: 2000;">
    <div class="modal-content sub-modal-content" style="max-width: 850px;">
      <span class="close-btn" onclick="closeSubModal()">&times;</span>
      <div id="subModalBody"></div>
    </div>
  </div>

  <div id="battleModal" class="modal" style="display:none; z-index: 3000;">
    <div class="modal-content battle-modal-content">

      <!-- 💡 1. 상단 보스/스테이지 정보 바 -->
      <div class="battle-top-bar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 id="battleTitle" style="color: var(--Red); margin: 0; font-size: 1.25em;">전투 돌입!</h2>
          <div id="raidStageInfo" style="display:none; color: var(--Yellow); font-weight: bold; font-size: 0.95em;"></div>
        </div>
        <div class="stage-boss-bar-wrap">
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.9em; margin-bottom:3px;">
            <span id="battleMonsterName" style="color: #FCD34D; font-weight:bold;">몬스터</span>
            <span id="monsterHpText" style="color: #F8FAFC; font-weight:bold; font-size:0.85em;">HP: ? / ?</span>
          </div>
          <div class="stage-hp-track">
            <div id="monsterHpBar" class="stage-hp-fill-enemy"></div>
          </div>
        </div>
      </div>

      <!-- 💡 2. 중앙 횡스크롤 전투 무대 (좌측 아군 진영 / 우측 적군 진영) -->
      <div class="battle-stage">
        <!-- 화면 중앙 스킬 발동 / 기믹 알림 배너 -->
        <div id="battleSkillBanner" class="battle-skill-banner" style="display:none;"></div>

        <!-- 좌측: 아군 진영 (싱글 사냥: 대표+동료 / 파티 레이드: 3명 횡대) -->
        <div class="stage-allies">
          <!-- 싱글 모드 -->
          <div id="singlePlayerContainer" class="single-player-stage">
            <div id="merc1BattleBox" class="merc-mini-box" style="display:none;">
              <img id="merc1BattleImg" src="" class="merc-mini-img">
              <img id="merc1EffectImg" src="" onerror="this.style.display='none'" class="effect-overlay-mini">
            </div>

            <div class="aura-avatar battle-hero-avatar">
              <img id="battlePlayerAura" class="avatar-aura" alt="" aria-hidden="true" onerror="this.style.display='none'" style="display:none;">
              <img id="battlePlayerImg" class="avatar-skin battle-hero-img" src="https://drive.google.com/thumbnail?id=1uoFPxFfpUaxE3eZCbrVU8oEvQLyQTg9b&sz=w200">
              <img id="playerEffectImg" src="" onerror="this.style.display='none'" class="effect-overlay-main">
            </div>

            <div id="merc2BattleBox" class="merc-mini-box" style="display:none;">
              <img id="merc2BattleImg" src="" class="merc-mini-img">
              <img id="merc2EffectImg" src="" onerror="this.style.display='none'" class="effect-overlay-mini">
            </div>
          </div>

          <!-- 3인 파티 던전 모드 (가로 횡대 정렬) -->
          <div id="partyPlayerContainer" class="party-stage-container" style="display:none;"></div>
        </div>

        <!-- 우측: 적군 진영 -->
        <div class="stage-enemies">
          <div class="monster-stage-anchor">
            <img id="battleMonsterImg" src="" class="monster-stage-img">
            <img id="monsterEffectImg" src="" onerror="this.style.display='none'" class="effect-overlay-main">
          </div>
          <div id="monsterStatusIcons" class="stage-status-icons"></div>
          <div id="monsterBattleSkills" style="display:none;"></div>
        </div>
      </div>

      <!-- 💡 3. 하단 플레이어 상태창 & 컴팩트 로그 패널 -->
      <div class="battle-bottom-panel">
        <!-- 싱글용 상태창 -->
        <div id="bottomPlayerStatus" class="bottom-player-status">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <div id="battlePlayerName" class="bottom-player-name">플레이어</div>
            <div id="playerHpText" class="bottom-player-hp">HP: ? / ?</div>
          </div>
          <div class="bottom-hp-track">
            <div id="playerHpBar" class="bottom-hp-fill-player"></div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px;">
            <div id="playerStatusIcons" style="display:flex; gap:4px; min-height:22px; flex-wrap:wrap;"></div>
            <div id="playerBattleSkills" style="display:flex; gap:6px; justify-content:flex-end; min-height:42px;"></div>
          </div>
        </div>

        <!-- 💡 [신규] 3인 파티용 상태창 (알아서 3등분 됨) -->
        <div id="bottomPartyStatus" class="bottom-party-status" style="display:none;"></div>

        <!-- 우측 로그 패널 -->
        <div class="bottom-log-panel">
          <div id="battleLog" class="battle-log-compact"></div>
          <button class="btn-main battle-flee-btn" onclick="fleeBattle()">후퇴 (도망)</button>
        </div>
      </div>

    </div>
  </div>

  <div id="uiPopup"
    style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; backdrop-filter:blur(3px);">
    <div
      style="background:var(--Panel); border:2px solid var(--Highlight); border-radius:15px; padding:30px; width:85%; max-width:350px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.8); animation:cardPop 0.3s ease-out forwards;">
      <h3 id="uiPopupTitle" style="margin-top:0; color:var(--Highlight); font-size:1.4em;">알림</h3>
      <p id="uiPopupMessage" style="font-size:1.1em; margin:25px 0; color:var(--TextMain); line-height:1.5;"></p>
      <div id="uiPopupButtons" style="display:flex; gap:10px; justify-content:center;"></div>
    </div>
  </div>

  <!-- 💡 [신규] 전역 로딩 및 클릭 차단 오버레이 -->
  <div id="globalLoadingOverlay" class="global-loading-overlay" style="display:none;">
    <div class="global-loading-box">
      <div class="global-loading-spinner"></div>
      <div id="globalLoadingText" class="global-loading-text">⏳ 서버와 통신 중입니다...</div>
      <div style="font-size:0.85em; color:#94A3B8; margin-top:8px;">잠시만 기다려주세요 (창을 닫지 마세요)</div>
    </div>
  </div>

  <script src="js_core.js"></script>
  <script src="js_expedition.js"></script>
  <script src="js_shop.js"></script>
  <script src="js_battle.js"></script>
  <script src="js_admin.js"></script>
</body>

</html>
