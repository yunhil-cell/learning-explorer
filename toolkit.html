<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배움 원정대 - 교실 툴킷</title>
  <link rel="icon" href="favicon/favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    @font-face {
      font-family: 'NanumSquareNeo';
      src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-bRg.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'NanumSquareNeo';
      src: url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-cBd.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
    }
    * {
      box-sizing: border-box;
      font-family: 'NanumSquareNeo', sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 45%, #0F172A 100%);
      color: #1E293B;
      user-select: none;
    }

    :root {
      --tk-font-scale: 1;
    }

    /* 데스크톱 위젯 도화지 */
    #tkDesktop {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-size: calc(18px * var(--tk-font-scale));
    }

    /* 우측 도구 도크 및 숨기기/보이기 손잡이 */
    .tk-dock-wrap {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 9000;
      transition: transform 0.25s ease;
    }
    .tk-dock-wrap.collapsed {
      transform: translateX(calc(100% + 16px));
    }
    .tk-dock-toggle {
      position: absolute;
      left: -30px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      padding: 12px 4px;
      background: rgba(255, 255, 255, 0.95);
      color: #334155;
      border: 1px solid #CBD5E1;
      border-right: none;
      border-radius: 12px 0 0 12px;
      box-shadow: -4px 4px 12px rgba(0, 0, 0, 0.2);
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 0.78em;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .tk-dock-toggle:hover {
      background: #FFF7ED;
      color: #C2410C;
    }
    .tk-dock {
      width: 152px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 12px 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tk-dock-title {
      font-size: 0.85em;
      font-weight: bold;
      color: #475569;
      text-align: center;
      padding-bottom: 6px;
      border-bottom: 1px solid #E2E8F0;
    }
    .tk-dock-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tk-tool-btn {
      position: relative;
      aspect-ratio: 1;
      border: 1.5px solid #E2E8F0;
      border-radius: 50%;
      background: #FFFFFF;
      color: #1E293B;
      font-weight: bold;
      font-size: 0.78em;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      transition: 0.15s;
      padding: 4px;
    }
    .tk-tool-btn:hover {
      border-color: #F97316;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.2);
    }
    .tk-tool-btn.active {
      border-color: #F97316;
      background: #FFF7ED;
      color: #C2410C;
    }
    .tk-tool-btn .tk-plus {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #F97316;
      color: white;
      font-size: 12px;
      line-height: 18px;
      text-align: center;
    }
    .tk-reset-btn {
      border: none;
      background: #E2E8F0;
      color: #475569;
      border-radius: 10px;
      padding: 8px;
      font-size: 0.78em;
      font-weight: bold;
      cursor: pointer;
    }
    .tk-reset-btn:hover {
      background: #CBD5E1;
    }

    /* 개별 위젯 창 */
    .tk-window {
      position: absolute;
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 180px;
      min-height: 130px;
    }
    .tk-window.maximized {
      border-radius: 0;
      border: none;
    }
    .tk-win-header {
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      padding: 7px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      font-size: 0.85em;
      font-weight: bold;
      color: #334155;
      flex-shrink: 0;
      gap: 6px;
    }
    .tk-win-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tk-win-btn {
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: #475569;
      border-radius: 4px;
      font-size: 0.78em;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1.2;
    }
    .tk-win-btn:hover {
      background: #E2E8F0;
    }
    .tk-win-btn.active {
      background: #3B82F6;
      border-color: #3B82F6;
      color: #FFFFFF;
    }
    .tk-win-close {
      border: none;
      background: transparent;
      color: #64748B;
      font-size: 1.15em;
      font-weight: bold;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .tk-win-close:hover {
      color: #EF4444;
    }
    .tk-win-body {
      flex: 1;
      min-height: 0;
      position: relative;
      container-type: size;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: text;
    }
    .tk-resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, #94A3B8 50%, #94A3B8 65%, transparent 65%, transparent 80%, #94A3B8 80%);
      z-index: 5;
    }

    /* 위젯별 스타일 */
    .tk-clock-wrap {
      width: 100%;
      height: 100%;
      background: #0B1120;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
    }
    .tk-clock-time {
      font-size: clamp(24px, min(18cqw, 38cqh), 240px);
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      line-height: 1.1;
    }
    .tk-clock-date {
      font-size: clamp(14px, min(5.5cqw, 12cqh), 54px);
      color: #94A3B8;
      margin-top: 8px;
    }

    .tk-timer-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      background: #FFFFFF;
    }
    .tk-timer-display {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, min(17cqw, 36cqh), 210px);
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      color: #0F172A;
      background: #F1F5F9;
      border-radius: 10px;
      margin-bottom: 8px;
      padding: 6px;
    }
    .tk-timer-display > span {
      display: inline-flex;
      align-items: baseline;
    }
    .tk-timer-ms {
      font-size: 0.52em;
      color: #475569;
      margin-left: 2px;
    }
    .tk-timer-display.ended {
      background: #FEE2E2;
      color: #DC2626;
    }
    .tk-btn-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tk-mini-btn {
      border: 1px solid #CBD5E1;
      background: #F8FAFC;
      color: #1E293B;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.8em;
      font-weight: bold;
      cursor: pointer;
    }
    .tk-mini-btn.primary {
      background: #3B82F6;
      border-color: #3B82F6;
      color: white;
    }
    .tk-mini-btn.danger {
      background: #EF4444;
      border-color: #EF4444;
      color: white;
    }
    .tk-mini-btn.warn {
      background: #F59E0B;
      border-color: #F59E0B;
      color: #1E293B;
    }

    .tk-memo-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      gap: 6px;
      flex-shrink: 0;
    }
    .tk-color-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    .tk-memo-area {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      padding: 12px;
      color: #0F172A;
      font-weight: bold;
      line-height: 1.45;
    }

    .tk-dday-wrap {
      width: 100%;
      height: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tk-dday-num {
      font-size: clamp(24px, 20cqw, 72px);
      font-weight: bold;
      color: #059669;
      text-align: center;
      line-height: 1.1;
    }

    .tk-check-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tk-check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F8FAFC;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
      font-size: 0.9em;
    }
    .tk-check-item.done span {
      text-decoration: line-through;
      color: #94A3B8;
    }

    .tk-dice-wrap {
      width: 100%;
      height: 100%;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tk-dice-grid {
      flex: 1;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      align-content: center;
      overflow-y: auto;
      padding: 4px;
    }
    @keyframes diceBounce3D {
      0%   { transform: translateY(0) scale(1); }
      30%  { transform: translateY(-22px) scale(1.1); }
      60%  { transform: translateY(3px) scale(0.95); }
      85%  { transform: translateY(-8px) scale(1.03); }
      100% { transform: translateY(0) scale(1); }
    }
    .tk-dice-scene {
      perspective: 420px;
      flex-shrink: 0;
    }
    .tk-dice-scene.bouncing {
      animation: diceBounce3D 0.65s ease-out;
    }
    .tk-cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.18, 0.89, 0.32, 1.12);
    }
    .tk-cube-face {
      position: absolute;
      inset: 0;
      background: #FFFFFF;
      color: #0F172A;
      border: 2px solid #94A3B8;
      border-radius: 10px;
      box-shadow: inset 0 0 8px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      backface-visibility: visible;
    }

    /* 판서/문서 위젯 */
    .tk-board-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
    }
    .tk-board-wrap.chalk-mode {
      background: #143D2B;
      border: 4px solid #78350F;
    }
    .tk-board-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      padding: 6px 8px;
      background: #F1F5F9;
      border-bottom: 1px solid #CBD5E1;
      flex-shrink: 0;
    }
    .tk-board-select {
      padding: 3px 6px;
      border: 1px solid #CBD5E1;
      border-radius: 5px;
      background: #FFFFFF;
      color: #1E293B;
      font-size: 0.78em;
      font-weight: bold;
      cursor: pointer;
    }
    .tk-board-btn {
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: #1E293B;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 0.78em;
      font-weight: bold;
      cursor: pointer;
    }
    .tk-board-btn:hover {
      background: #E2E8F0;
    }
    .tk-board-editor {
      flex: 1;
      width: 100%;
      padding: 14px;
      outline: none;
      overflow-y: auto;
      color: #1E293B;
      font-family: 'Nanum Gothic Coding', 'D2Coding', monospace !important;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.55;
      user-select: text;
    }
    .tk-board-wrap.chalk-mode .tk-board-editor {
      color: #FFFFFF;
    }
    .tk-board-editor * {
      font-family: 'Nanum Gothic Coding', 'D2Coding', monospace !important;
    }

    /* 랜덤 뽑기 / 레이스 / 돌림판 / 자리바꾸기 위젯 */
    .tk-sub-panel {
      background: #F8FAFC;
      border-bottom: 1px solid #E2E8F0;
      padding: 8px 10px;
      font-size: 0.78em;
      max-height: 150px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .tk-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .tk-chip {
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      color: #334155;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.9em;
      cursor: pointer;
      user-select: none;
    }
    .tk-chip.excluded {
      background: #E2E8F0;
      color: #94A3B8;
      text-decoration: line-through;
    }
    .tk-pick-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      background: radial-gradient(circle, #FFFBEB 0%, #FFFFFF 75%);
    }
    .tk-pick-avatar {
      width: clamp(72px, 34cqh, 150px);
      height: clamp(72px, 34cqh, 150px);
      object-fit: contain;
      margin-bottom: 8px;
    }
    .tk-pick-name {
      font-size: clamp(20px, 10cqw, 44px);
      font-weight: bold;
      color: #1E293B;
    }

    /* 핀볼 레이스 */
    .tk-pinball-stage {
      flex: 1;
      position: relative;
      background: #0F172A;
      overflow: hidden;
      min-height: 0;
    }
    .tk-pinball-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .tk-pinball-hud {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.78);
      color: #F8FAFC;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 0.74em;
      line-height: 1.45;
      pointer-events: none;
      max-width: 170px;
    }
    .tk-pinball-winner {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.92);
      border: 2.5px solid #F59E0B;
      border-radius: 14px;
      padding: 16px 26px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      z-index: 15;
    }
    .tk-weight-badge {
      display: inline-block;
      background: #3B82F6;
      color: #FFFFFF;
      border-radius: 8px;
      padding: 0 5px;
      font-size: 0.85em;
      margin-left: 3px;
    }
    .tk-wheel-live {
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 0.82em;
      font-weight: bold;
      color: #FFFFFF;
      background: #334155;
      margin-bottom: 4px;
      min-height: 24px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* 돌림판 */
    .tk-wheel-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 8px;
      overflow: hidden;
    }
    .tk-wheel-pointer {
      font-size: 20px;
      color: #EF4444;
      line-height: 1;
      margin-bottom: -4px;
      z-index: 5;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
    }
    .tk-wheel-canvas {
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      transition: transform 4s cubic-bezier(0.12, 0.86, 0.2, 1);
    }

    /* 자리 바꾸기 */
    .tk-seat-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #E2E8F0;
    }
    .tk-mini-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .tk-seat-toolbar {
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      border-bottom: 1px solid #CBD5E1;
      flex-shrink: 0;
    }
    .tk-seat-toolbar-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      gap: 6px;
    }
    .tk-seat-toolbar-row.sub {
      background: #F8FAFC;
      border-top: 1px solid #E2E8F0;
      padding: 5px 10px;
    }
    .tk-seat-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      padding: 16px;
    }
    .tk-seat-overlay-box {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tk-seat-board {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #E2E8F0;
    }
    .tk-seat-front {
      background: #143D2B;
      color: #FFFFFF;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.82em;
      font-weight: bold;
      border: 2px solid #78350F;
      width: 55%;
      margin: 0 auto;
      flex-shrink: 0;
    }
    .tk-seat-grid {
      display: grid;
      row-gap: 8px;
      column-gap: 6px;
      align-items: stretch;
    }
    .tk-seat-aisle {
      pointer-events: none;
    }
    .tk-seat-card {
      background: #FFFFFF;
      border: 2px solid #94A3B8;
      border-radius: 8px;
      min-height: 50px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.08);
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .tk-seat-card.selected {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
      transform: translateY(-2px);
    }
    .tk-seat-card.drag-over {
      border-color: #10B981;
      background: #ECFDF5;
    }
    .tk-seat-card.concealed {
      background: #334155;
      border-color: #1E293B;
      color: #F8FAFC;
    }
    .tk-seat-card.concealed b {
      color: #FBBF24;
    }
    .tk-seat-card.inactive {
      background: transparent;
      border: 2px dashed #94A3B8;
      box-shadow: none;
      color: #64748B;
      font-size: 0.78em;
    }
    .tk-seat-card.inactive:hover {
      background: rgba(255, 255, 255, 0.45);
      border-color: #475569;
    }
    .tk-seat-card b {
      font-size: 0.92em;
      color: #0F172A;
      word-break: keep-all;
      pointer-events: none;
    }
    .tk-seat-pin-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #94A3B8;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }
    .tk-seat-pin-dot.locked {
      background: #EF4444;
      border-color: #B91C1C;
    }
    .tk-seat-deact-btn {
      position: absolute;
      top: 2px;
      left: 4px;
      border: none;
      background: transparent;
      color: #94A3B8;
      font-size: 0.75em;
      font-weight: bold;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
    }
    .tk-seat-deact-btn:hover {
      color: #EF4444;
    }
    .tk-seat-countdown {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(48px, 22cqw, 140px);
      font-weight: bold;
      color: #FBBF24;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      z-index: 20;
      pointer-events: none;
    }

    /* 설정 모달 */
    #tkSettingsModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      z-index: 95000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .tk-settings-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 22px;
      width: 92%;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .tk-theme-btn {
      border: 2px solid #CBD5E1;
      border-radius: 10px;
      padding: 10px 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.82em;
      text-align: center;
    }
    .tk-theme-btn.active {
      border-color: #3B82F6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.35);
    }

    /* PIN 인증 오버레이 */
    #tkPinGate {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .tk-pin-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 28px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>

<body>
  <div id="tkDesktop"></div>

  <div id="tkDockWrap" class="tk-dock-wrap">
    <button id="tkDockToggle" class="tk-dock-toggle" onclick="toggleToolkitDock()">메뉴바 숨기기</button>
    <div class="tk-dock">
      <div class="tk-dock-title">교실 툴킷</div>
    <div class="tk-dock-grid">
      <button class="tk-tool-btn" data-type="clock" onclick="toggleWidget('clock')"><span>시계</span></button>
      <button class="tk-tool-btn" data-type="memo" onclick="createMemoWidget()"><span class="tk-plus">+</span><span>메모</span></button>
      <button class="tk-tool-btn" data-type="timer" onclick="toggleWidget('timer')"><span>타이머</span></button>
      <button class="tk-tool-btn" data-type="dday" onclick="toggleWidget('dday')"><span>디데이</span></button>
      <button class="tk-tool-btn" data-type="checklist" onclick="toggleWidget('checklist')"><span>체크</span></button>
      <button class="tk-tool-btn" data-type="dice" onclick="toggleWidget('dice')"><span>주사위</span></button>
      <button class="tk-tool-btn" data-type="qr" onclick="toggleWidget('qr')"><span>QR코드</span></button>
      <button class="tk-tool-btn" data-type="board" onclick="createBoardWidget()"><span class="tk-plus">+</span><span>판서</span></button>
      <button class="tk-tool-btn" data-type="pick" onclick="toggleWidget('pick')"><span>랜덤뽑기</span></button>
      <button class="tk-tool-btn" data-type="race" onclick="toggleWidget('race')"><span>핀볼레이스</span></button>
      <button class="tk-tool-btn" data-type="wheel" onclick="toggleWidget('wheel')"><span>돌림판</span></button>
      <button class="tk-tool-btn" data-type="seat" onclick="toggleWidget('seat')"><span>자리배치</span></button>
    </div>
    <button class="tk-reset-btn" style="background:#DBEAFE; color:#1D4ED8;" onclick="openSettingsModal()">기본 설정</button>
      <button class="tk-reset-btn" onclick="resetToolkitLayout()">배치 초기화</button>
    </div>
  </div>

  <!-- 기본 설정 모달 -->
  <div id="tkSettingsModal">
    <div class="tk-settings-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0; color:#1E293B;">툴킷 기본 설정</h3>
        <button class="tk-win-close" onclick="closeSettingsModal()">&times;</button>
      </div>
      <div style="margin-bottom:16px;">
        <div style="font-weight:bold; font-size:0.9em; color:#334155; margin-bottom:8px;">기본 글자 크기 (1~5단계)</div>
        <div id="tkFontScaleBtns" style="display:flex; gap:6px;"></div>
      </div>
      <div style="margin-bottom:16px;">
        <div style="font-weight:bold; font-size:0.9em; color:#334155; margin-bottom:8px;">배경 테마</div>
        <div id="tkThemeBtns" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"></div>
      </div>
      <button onclick="closeSettingsModal()"
        style="width:100%; padding:10px; border:none; border-radius:10px; background:#3B82F6; color:white; font-weight:bold; cursor:pointer;">닫기</button>
    </div>
  </div>

  <!-- 단독 접속 시 교사 PIN 확인 창 -->
  <div id="tkPinGate">
    <div class="tk-pin-card">
      <h3 style="margin-top:0; color:#1E293B;">교사 모드 확인</h3>
      <p style="font-size:0.9em; color:#475569;">교사용 PIN 6자리를 입력하세요.</p>
      <input id="tkPinInput" type="password" maxlength="6" placeholder="6자리 숫자"
        style="width:100%; padding:12px; font-size:1.3em; text-align:center; border:1.5px solid #CBD5E1; border-radius:10px; margin-bottom:14px;">
      <button onclick="verifyToolkitPin()"
        style="width:100%; padding:12px; border:none; border-radius:10px; background:#3B82F6; color:white; font-weight:bold; font-size:1em; cursor:pointer;">확인</button>
      <div id="tkPinErr" style="color:#EF4444; font-size:0.85em; margin-top:8px;"></div>
    </div>
  </div>

  <script src="js_toolkit.js"></script>
  <script src="js_toolkit_basic.js"></script>
  <script src="js_toolkit_class.js"></script>
</body>

</html>
